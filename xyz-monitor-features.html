<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>xyz-monitor · feature map</title>
<style>
:root{
  --bg:#070b0f;--panel:#0d141b;--panel2:#111a23;--panel3:#161f29;--border:#1e2b38;--border2:#2b3d4f;
  --text:#c8d4e0;--dim:#647689;--faint:#3d4c5c;
  --amber:#f0a832;--green:#35c98a;--red:#e05656;--blue:#4aa3ff;--purple:#a184ff;--cyan:#3ec6c6;--clay:#c98a3c;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","JetBrains Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:var(--mono);font-size:13px;height:100%}
body{display:flex;flex-direction:column;overflow:hidden}

header{display:flex;align-items:baseline;gap:14px;padding:11px 18px 9px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.brand{font-size:15px;letter-spacing:.14em;color:var(--amber);font-weight:700;text-transform:uppercase}
.brand b{color:var(--text)}
.sub{color:var(--dim);font-size:11px}
.hsearch{margin-left:auto;display:flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--border2);border-radius:4px;padding:5px 9px}
.hsearch input{all:unset;font:inherit;font-size:12px;color:var(--text);width:190px}
.hsearch input::placeholder{color:var(--faint)}
.hsearch span{color:var(--faint);font-size:11px}
.scopekey{display:flex;gap:9px;font-size:10px;color:var(--dim);align-items:center}
.sc{display:inline-block;padding:1px 5px;border-radius:3px;border:1px solid;font-size:9.5px;letter-spacing:.08em}
.sc.both{color:var(--green);border-color:var(--green)}
.sc.stk{color:var(--blue);border-color:var(--blue)}
.sc.cry{color:var(--clay);border-color:var(--clay)}
.sc.adm{color:var(--red);border-color:var(--red)}

nav{display:flex;gap:2px;padding:0 18px;border-bottom:1px solid var(--border);background:var(--panel);flex-shrink:0;overflow-x:auto}
nav button{all:unset;border-bottom:2px solid transparent;color:var(--dim);font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;padding:10px 14px;cursor:pointer;white-space:nowrap}
nav button:hover{color:var(--text)}
nav button.on{color:var(--amber);border-bottom-color:var(--amber)}
nav button:focus-visible{outline:1px solid var(--amber);outline-offset:-2px}

main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 400px}
#body{overflow-y:auto;padding:0}
#det{border-left:1px solid var(--border);background:var(--panel);overflow-y:auto;padding:16px 16px 30px}
.pane{display:none}.pane.on{display:block}

/* ---------- tree ---------- */
.grp{border-bottom:1px solid var(--border)}
.grp>.gh{display:flex;align-items:center;gap:9px;padding:9px 16px;cursor:pointer;background:var(--panel)}
.grp>.gh:hover{background:var(--panel2)}
.gh .car{color:var(--faint);width:9px;font-size:10px}
.gh .gt{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.gh .gn{margin-left:auto;color:var(--faint);font-size:10px}
.grp.open>.gh .car{color:var(--amber)}
.gb{display:none;padding:2px 0 8px}
.grp.open>.gb{display:block}

.feat{display:flex;align-items:baseline;gap:9px;padding:6px 16px 6px 30px;cursor:pointer;border-left:2px solid transparent}
.feat:hover{background:var(--panel2)}
.feat.sel{background:var(--panel3);border-left-color:var(--amber)}
.feat .fn{font-weight:700;font-size:12.5px;min-width:auto}
.feat .fd{color:var(--dim);font-size:11px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.feat .fm{display:flex;gap:5px;flex-shrink:0;align-items:center}
.feat .cnt{color:var(--faint);font-size:10px}
.feat.hide{display:none}
.grp.hide{display:none}

/* ---------- detail ---------- */
#det .kick{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-bottom:5px}
#det h2{font-size:15px;margin-bottom:3px;letter-spacing:.02em}
#det .lead{color:var(--dim);font-size:11.5px;line-height:1.55;margin:6px 0 4px}
#det h3{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin:15px 0 6px;border-top:1px solid var(--border);padding-top:9px}
#det ul{list-style:none}
#det li{padding:4px 0 4px 14px;position:relative;font-size:12px;line-height:1.55}
#det li::before{content:"·";position:absolute;left:2px;color:var(--amber)}
#det li b{color:#e8eef4;font-weight:700}
#det .chips span{display:inline-block;background:var(--panel2);border:1px solid var(--border);border-radius:3px;
  padding:2px 6px;margin:2px 3px 2px 0;font-size:10.5px;color:var(--cyan)}
#det .why{border-left:2px solid var(--red);padding:7px 0 7px 10px;color:var(--dim);font-size:11.5px;line-height:1.55;margin-top:10px}
#det .why b{color:var(--red);font-weight:700;letter-spacing:.1em;font-size:10px;display:block;margin-bottom:3px}
#det .hint{color:var(--faint);font-size:10.5px;margin-top:20px}

/* ---------- tables ---------- */
.tw{padding:14px 18px 34px}
.tw>p.intro{color:var(--dim);font-size:11.5px;line-height:1.6;max-width:820px;margin-bottom:12px}
table{width:100%;border-collapse:collapse}
th{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);text-align:left;
  padding:6px 8px;border-bottom:1px solid var(--border2);position:sticky;top:0;background:var(--bg);z-index:2}
td{padding:6px 8px;border-bottom:1px solid var(--border);font-size:11.5px;vertical-align:top;line-height:1.45}
tbody tr{cursor:default}
tbody tr:hover td{background:var(--panel2)}
td.k{color:var(--amber);white-space:nowrap}
td.n{color:var(--dim)}
.pos{color:var(--green)}.neg{color:var(--red)}.mut{color:var(--faint)}
.tag{font-size:9.5px;letter-spacing:.08em;padding:1px 5px;border-radius:3px;border:1px solid;white-space:nowrap}
.tag.long{color:var(--green);border-color:var(--green)}
.tag.short{color:var(--red);border-color:var(--red)}
.tag.ctx{color:var(--faint);border-color:var(--faint)}
.tag.dual{color:var(--amber);border-color:var(--amber)}
.tag.shad{color:var(--purple);border-color:var(--purple)}
.tag.on{color:var(--green);border-color:var(--green)}
.tag.off{color:var(--faint);border-color:var(--faint)}
.tag.adm{color:var(--red);border-color:var(--red)}
td .hint2{color:var(--faint);font-size:10.5px}

/* hover tooltip engine */
#tip{position:fixed;z-index:99;display:none;max-width:330px;background:#0a1016;border:1px solid var(--border2);
  border-radius:4px;padding:9px 11px;color:var(--dim);font-size:11px;line-height:1.55;box-shadow:0 8px 24px rgba(0,0,0,.6);pointer-events:none}
#tip b{color:var(--text)}
[data-tip]{cursor:help}

/* matrix */
.mx td:first-child,.mx th:first-child{position:sticky;left:0;background:var(--bg)}
.mx tbody tr:hover td:first-child{background:var(--panel2)}
.dot{display:inline-block;width:8px;height:8px;border-radius:2px}
.dot.y{background:var(--green)}.dot.n{background:#20303d}.dot.p{background:var(--clay)}

footer{border-top:1px solid var(--border);color:var(--faint);font-size:10.5px;padding:7px 18px;display:flex;gap:16px;flex-shrink:0}
footer b{color:var(--dim);font-weight:400}

@media (max-width:920px){main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) minmax(0,.85fr)}
  #det{border-left:none;border-top:1px solid var(--border)}.hsearch input{width:120px}}
</style>
</head>
<body>

<header>
  <span class="brand">xyz-<b>monitor</b></span>
  <span class="sub">feature map</span>
  <span class="scopekey">
    <span class="sc both">both</span><span class="sc stk">xyz only</span><span class="sc cry">crypto only</span><span class="sc adm">admin</span>
  </span>
  <label class="hsearch"><span>/</span><input id="q" type="text" placeholder="filter features…" autocomplete="off" spellcheck="false"></label>
</header>

<nav id="nav">
  <button data-p="tree" class="on">Feature tree</button>
  <button data-p="sig">Signal roster</button>
  <button data-p="alerts">Alert classes</button>
  <button data-p="cols">Table columns</button>
  <button data-p="matrix">Scope matrix</button>
</nav>

<main>
  <div id="body">
    <div class="pane on" data-p="tree" id="tree"></div>
    <div class="pane" data-p="sig" id="sig"></div>
    <div class="pane" data-p="alerts" id="alerts"></div>
    <div class="pane" data-p="cols" id="cols"></div>
    <div class="pane" data-p="matrix" id="matrix"></div>
  </div>
  <aside id="det"></aside>
</main>

<footer>
  <span><b>tree</b> — click a feature for the full detail · hover any cell for its explanation</span>
  <span style="margin-left:auto">standalone visualization — not part of the repo</span>
</footer>

<div id="tip"></div>

<script>
/* ================= tooltip engine (hover on every table cell / tagged element) ============= */
const tip=document.getElementById("tip");
document.addEventListener("mouseover",e=>{
  const t=e.target.closest("[data-tip]");if(!t)return;
  tip.innerHTML=t.dataset.tip;tip.style.display="block";move(e);});
document.addEventListener("mousemove",e=>{if(tip.style.display==="block")move(e);});
document.addEventListener("mouseout",e=>{if(e.target.closest("[data-tip]"))tip.style.display="none";});
function move(e){const w=tip.offsetWidth,h=tip.offsetHeight;
  let x=e.clientX+14,y=e.clientY+16;
  if(x+w>innerWidth-8)x=e.clientX-w-14; if(y+h>innerHeight-8)y=e.clientY-h-16;
  tip.style.left=Math.max(4,x)+"px";tip.style.top=Math.max(4,y)+"px";}

const SCL={both:["both","both universes"],stk:["stk","xyz equities only"],cry:["cry","crypto only"],adm:["adm","admin-gated"]};
const treeEl=document.getElementById("tree");
let idx=[];
treeEl.innerHTML=TREE.map((g,gi)=>{
  const items=g.items.map((f,fi)=>{
    idx.push({gi,fi,txt:(g.g+" "+f.nm+" "+f.fd+" "+(f.lead||"")+" "+(f.pts||[]).join(" ")+" "+(f.why||"")).toLowerCase()});
    const s=SCL[f.sc];
    return `<div class="feat" data-g="${gi}" data-f="${fi}">
      <span class="fn">${f.nm}</span><span class="fd">${f.fd}</span>
      <span class="fm"><span class="sc ${s[0]}" data-tip="${s[1]}">${s[0]}</span><span class="cnt">${(f.pts||[]).length}</span></span></div>`;
  }).join("");
  return `<section class="grp${gi<2?" open":""}" id="g${gi}">
    <div class="gh" data-g="${gi}"><span class="car">${gi<2?"▾":"▸"}</span><span class="gt">${g.g}</span>
    <span class="fd" style="color:var(--faint);font-size:11px">${g.n}</span><span class="gn">${g.items.length}</span></div>
    <div class="gb">${items}</div></section>`;
}).join("");

treeEl.addEventListener("click",e=>{
  const gh=e.target.closest(".gh");
  if(gh){const s=gh.parentElement;s.classList.toggle("grp");const o=s.classList.toggle("open");
    s.classList.add("grp");gh.querySelector(".car").textContent=o?"▾":"▸";return;}
  const f=e.target.closest(".feat");if(!f)return;
  document.querySelectorAll(".feat.sel").forEach(x=>x.classList.remove("sel"));
  f.classList.add("sel");showFeat(+f.dataset.g,+f.dataset.f);
});

const det=document.getElementById("det");
function showFeat(gi,fi){
  const g=TREE[gi],f=g.items[fi],s=SCL[f.sc];
  det.innerHTML=`<div class="kick">${g.g} · <span class="sc ${s[0]}">${s[1]}</span></div>
  <h2>${f.nm}</h2><div class="lead">${f.lead||f.fd}</div>
  ${(f.pts||[]).length?`<h3>Detail</h3><ul>${f.pts.map(p=>`<li>${p}</li>`).join("")}</ul>`:""}
  ${f.why?`<div class="why"><b>why it works this way</b>${f.why}</div>`:""}
  <div class="hint">${g.items.length} feature${g.items.length===1?"":"s"} in ${g.g}</div>`;
  det.scrollTop=0;
}
function detHome(){
  const n=idx.length,gn=TREE.length;
  det.innerHTML=`<div class="kick">overview</div><h2>${n} features across ${gn} areas</h2>
  <div class="lead">Every surface the app exposes, grouped by where it lives, with the reasoning behind the ones that look arbitrary.</div>

/* ================= alert classes ========================================================= */
const CLS=[
["setup","the existing trigger stream — a new ranked condition worth interrupting for","yes","no","Delegates to the shared trigEligible gate, so the browser and the bot can never announce different things. Your EV / R:R / lateness thresholds apply here."],
["ledger","the DEATH side of a claim setup already announced: void taken, target reached, or horizon resolved","yes","no","Deliberately one class rather than three — nobody wants target-hits but not stop-hits, and the message says which it is."],
["rule","a user-authored metric threshold rule fired","yes","no","Per-person rules with their own cooldowns; deleting a rule clears its armed state."],
["ops","the server telling on itself: stalls, degraded feeds, deploys","yes","ADMIN","Operator-only in delivery AND in the feed. Nobody can opt in by naming the class. Deploy notices are recorded but flagged quiet."],
["trend","arrival at a full 4/4 D1 stack, or a D1 ribbon flip","opt-in","no","D1 only — H12/H4 crossings across ~144 names would be a feed, not an alert."],
["filing","a material SEC filing on a covered name","opt-in","no","Material forms only. 45-minute boot grace period seeds the EDGAR backlog silently. Ownership filings (3/4/5/144/13G) were deliberately excluded as routine insider flow."],
["earnings","proximity to a scheduled print, and analyst flips","opt-in","no","Ships opt-in: it enters the ring and the in-app log immediately, and reaches a phone only once someone has seen its measured rate."],
["ai","an AI report became regeneratable on material change","opt-in","no","Material change means a new claim opened, a claim resolved, or an earnings print landed."],
["regime","tape-wide crowding or leverage hit an extreme","opt-in","no","Re-arm gate per scope and sub-metric, so one episode fires once. In force at boot = seeded, not announced."],
["coverage","a data gap on a name carrying an OPEN, announced claim","opt-in","no","Scoped deliberately: a gap on a name nobody is watching is a maintenance item for the coverage panel. A gap under a live claim means every number you were given about it is now computed from a stale spine — and you should know before you act."],
];
document.getElementById("alerts").innerHTML=`<div class="tw">
<p class="intro">Ten classes on one sequenced trigger stream with two consumers: the in-app bell and the Telegram bot. Both read the same ring with their own cursor. Every class enters through a single emitter and is stamped with its <b>kind</b>, so a consumer filters on a field that always exists rather than inferring class from which fields happen to be present.</p>
<table><thead><tr><th>class</th><th>what it announces</th><th data-tip="whether a freshly linked recipient receives this class before choosing anything. The default set is frozen to the four whose rates are known — every class added since is opt-in, so adding one can never retroactively subscribe anyone.">default</th><th>audience</th><th>notes</th></tr></thead><tbody>
${CLS.map(c=>`<tr><td class="k">${c[0]}</td><td>${c[1]}</td>
<td><span class="tag ${c[2]==="yes"?"on":"off"}">${c[2]}</span></td>
<td>${c[3]==="ADMIN"?'<span class="tag adm">admin</span>':'<span class="n">all</span>'}</td>
<td class="n">${c[4]}</td></tr>`).join("")}
</tbody></table>
<p class="intro" style="margin-top:18px"><b>Two classes were deliberately not built.</b> News headlines: the wire runs a per-name rotation across the whole roster, so attributed headlines land at tens per day — that's a tab to read, not an interruption. Ownership filings: several per day per active name of routine insider flow. Both would have been noise wearing an alert's clothes.</p>
<p class="intro"><b>Rate measurement.</b> Rolling 24h and 1h fire counts per class are shown next to each subscription checkbox, capped at 400 per class and reported as "400+" rather than a number that quietly understates. This exists because a deploy notice once fired five times per build and it only surfaced when it got annoying.</p>
</div>`;

/* ================= search + nav ========================================================== */
const q=document.getElementById("q");
q.addEventListener("input",()=>{
  const v=q.value.trim().toLowerCase();
  const feats=treeEl.querySelectorAll(".feat");
  if(!v){feats.forEach(f=>f.classList.remove("hide"));
    treeEl.querySelectorAll(".grp").forEach(g=>g.classList.remove("hide"));return;}
  treeEl.querySelectorAll(".grp").forEach(g=>{g.classList.add("open");g.querySelector(".car").textContent="▾";});
  let n=0;
  feats.forEach(f=>{
    const r=idx.find(i=>i.gi===+f.dataset.g&&i.fi===+f.dataset.f);
    const hit=r&&r.txt.includes(v);f.classList.toggle("hide",!hit);if(hit)n++;});
  treeEl.querySelectorAll(".grp").forEach(g=>{
    g.classList.toggle("hide",!g.querySelectorAll(".feat:not(.hide)").length);});
});
document.addEventListener("keydown",e=>{
  if(e.key==="/"&&document.activeElement!==q){e.preventDefault();q.focus();q.select();}
  if(e.key==="Escape"&&document.activeElement===q){q.value="";q.dispatchEvent(new Event("input"));q.blur();}});

document.getElementById("nav").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));
  document.querySelectorAll(".pane").forEach(p=>p.classList.toggle("on",p.dataset.p===b.dataset.p));
  document.getElementById("body").scrollTop=0;
  document.getElementById("det").style.display=b.dataset.p==="tree"?"":"none";
});
</script>
